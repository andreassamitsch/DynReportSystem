name: Build server installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Blazor app base path
        shell: pwsh
        run: |
          $app = Get-Content src/DynReportSystem/Components/App.razor -Raw
          if ($app -notmatch '<base\s+href="/"\s*/>') {
            throw 'App.razor must contain <base href="/" /> so relative Blazor framework endpoints resolve at the site root.'
          }

      - name: Vendor chart assets
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          node scripts/vendor-assets.mjs

      - name: Publish web app
        shell: pwsh
        run: |
          dotnet publish src/DynReportSystem/DynReportSystem.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o artifacts/web
          New-Item -ItemType Directory -Force artifacts/web/Reports | Out-Null
          Copy-Item src/DynReportSystem/appsettings.Production.json.example artifacts/web/appsettings.Production.json.example -Force
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/web/THIRD_PARTY_NOTICES.md -Force

      - name: Build setup executable
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/web/* -DestinationPath installer/DynReportSystem.Setup/payload.zip -Force
          dotnet publish installer/DynReportSystem.Setup/DynReportSystem.Setup.csproj `
            -c Release -r win-x64 --self-contained true `
            -o artifacts/setup
          Copy-Item sql/001-dynreport-metadata-schema.sql artifacts/setup/ -Force
          Copy-Item sql/002-fix-audit-and-reportgrant-index.sql artifacts/setup/ -Force
          Copy-Item sql/010-runtime-principal-template.sql artifacts/setup/ -Force
          Copy-Item docs/operations/backup-recovery.md artifacts/setup/ -Force
          Copy-Item docs/operations/sql-metadata-setup.md artifacts/setup/ -Force
          Copy-Item docs/operations/sql-performance-baseline.md artifacts/setup/ -Force
          Copy-Item docs/architecture/research-2026-09-27-platform-baseline.md artifacts/setup/ -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DynReportSystem-Server-Setup-0.19.1-win-x64
          path: |
            artifacts/setup/DynReportSystem-Server-Setup-0.19.1-win-x64.exe
            artifacts/setup/001-dynreport-metadata-schema.sql
            artifacts/setup/002-fix-audit-and-reportgrant-index.sql
            artifacts/setup/010-runtime-principal-template.sql
            artifacts/setup/backup-recovery.md
            artifacts/setup/sql-metadata-setup.md
            artifacts/setup/sql-performance-baseline.md
            artifacts/setup/research-2026-09-27-platform-baseline.md
          if-no-files-found: error
