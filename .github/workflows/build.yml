name: Build server installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vendor chart assets
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          node scripts/vendor-assets.mjs

      - name: Publish web app
        shell: pwsh
        run: |
          dotnet publish src/DynReportSystem/DynReportSystem.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o artifacts/web
          New-Item -ItemType Directory -Force artifacts/web/Reports | Out-Null
          Copy-Item src/DynReportSystem/appsettings.Production.json.example artifacts/web/appsettings.Production.json.example -Force
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/web/THIRD_PARTY_NOTICES.md -Force

      - name: Build setup executable
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/web/* -DestinationPath installer/DynReportSystem.Setup/payload.zip -Force
          dotnet publish installer/DynReportSystem.Setup/DynReportSystem.Setup.csproj `
            -c Release -r win-x64 --self-contained true `
            -o artifacts/setup

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DynReportSystem-Server-Setup-0.4.0-win-x64
          path: artifacts/setup/DynReportSystem-Server-Setup-0.4.0-win-x64.exe
          if-no-files-found: error
